<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produto</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <div><strong>Meu Sistema</strong></div>
    <div>
        <a th:href="@{/produtos}">Lista de Produtos</a>
        <a th:href="@{/logout}">Sair</a>
        <button id="toggle-dark">🌙 Modo Escuro</button>
    </div>
</div>

<!-- Formulário -->
<div class="container">
    <h2>Cadastro de Produto</h2>

    <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post" class="form-produto">
        <input type="hidden" th:field="*{id}"/>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" th:field="*{nome}" required/>

        <label for="descricao">Descrição:</label>
        <input type="text" id="descricao" th:field="*{descricao}" required/>

        <label for="preco">Preço:</label>
        <input type="text" id="preco" th:field="*{preco}" required/>

        <label for="estoque">Estoque:</label>
        <input type="text" id="estoque" th:field="*{estoque}" required/>

        <button type="submit" class="btn">Salvar</button>
    </form>
</div>

<!-- Script do modo escuro -->
<script>
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark');
    }

    document.getElementById('toggle-dark').addEventListener('click', () => {
        document.body.classList.toggle('dark');
        localStorage.setItem('darkMode', document.body.classList.contains('dark'));
    });
</script>

</body>
</html>
