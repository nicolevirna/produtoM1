<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="navbar">
    <div><strong>Meu Sistema</strong></div>
    <div>
        <a th:href="@{/produtos}">Produtos</a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="btn">Sair</button>
        </form>
        <button id="toggle-dark">🌙 Modo Escuro</button>
    </div>
</div>

<div class="container">
    <h1>Bem-vindo à Home de Produtos!</h1>
    <p>Use o menu acima para navegar.</p>
</div>

<script>
    // Aplica modo escuro se já estiver salvo
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark');
    }

    const toggle = document.getElementById('toggle-dark');
    toggle.addEventListener('click', () => {
        document.body.classList.toggle('dark');
        localStorage.setItem('darkMode', document.body.classList.contains('dark'));
    });
</script>

</body>
</html>
